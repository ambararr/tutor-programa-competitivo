<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juez Tutor | Programación competitiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F5FB;--panel:#FFFFFF;--ink:#14213D;--muted:#5A6678;--line:#DCE3EF;
  --navy:#081A47;--navy2:#0E2D78;--side:#08153A;--side-ink:#E6ECF7;--side-muted:#8FA1C6;
  --brand:#2F6BFF;--brand-ink:#FFFFFF;--soft:#E6EEFF;
  --ac:#17855A;--ac-bg:#DDF3E8;--wa:#BF3A2B;--wa-bg:#FADFDA;--tle:#A86A00;--tle-bg:#FBEBC8;
  --code-bg:#0B1633;--code-ink:#DCE6F8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220;--panel:#111C31;--ink:#E7EDF8;--muted:#9AA9C2;--line:#233350;--soft:#16264A;
    --side:#060C1C;--brand:#5B8CFF;--brand-ink:#08153A;
    --ac:#4CD197;--ac-bg:#12382B;--wa:#FF8B7C;--wa-bg:#442019;--tle:#F2B94B;--tle-bg:#41300A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220;--panel:#111C31;--ink:#E7EDF8;--muted:#9AA9C2;--line:#233350;--soft:#16264A;
  --side:#060C1C;--brand:#5B8CFF;--brand-ink:#08153A;
  --ac:#4CD197;--ac-bg:#12382B;--wa:#FF8B7C;--wa-bg:#442019;--tle:#F2B94B;--tle-bg:#41300A;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;font-size:17px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
main{min-width:0;outline:none}

/* ---------- menú lateral ---------- */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding:20px 14px 28px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand svg{flex:0 0 40px}
.brand b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand span{color:var(--side-muted);font-size:13px}
.meter{margin:12px 8px 4px;font-size:13px;color:var(--side-muted)}
.meter .bar{height:6px;background:rgba(255,255,255,.14);border-radius:4px;margin-top:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2F6BFF,#5EE0B0);transition:width .4s}
.nav{list-style:none;margin:10px 0 0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;color:var(--side-ink);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:15.5px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--brand);color:#fff;font-weight:600}
.nav .n{flex:0 0 26px;font-size:16px;text-align:center}
.nav .t{flex:1}
.nav .v{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;display:none}
.nav .v.ac{display:inline-block;background:var(--ac-bg);color:var(--ac)}
.nav .v.wa{display:inline-block;background:var(--wa-bg);color:var(--wa)}
.nav .seen{width:8px;height:8px;border-radius:50%;background:#5EE0B0;opacity:0}
.nav .seen.on{opacity:1}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:10px 6px}

.top{display:none}
.scrim{display:none}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;padding:13px 22px;border-radius:10px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.solid{background:var(--brand);color:var(--brand-ink)}
.btn.outline{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.white{background:#fff;color:#0E2D78}

/* ---------- héroe ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#061238 0%,#0B2466 55%,#0F3A9E 100%);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 75%)}
.hero-in{position:relative;max-width:1150px;margin:0 auto;padding:56px clamp(18px,5vw,56px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:center}
.pill{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;font-size:14px;margin-bottom:18px}
.hero h1{font-size:clamp(36px,5.2vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:0 0 16px}
.hero h1 em{font-style:normal;color:#5C93FF}
.hero p{color:#C7D5F5;font-size:18px;max-width:46ch;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{list-style:none;display:flex;gap:10px 22px;flex-wrap:wrap;padding:0;margin:30px 0 0;color:#B9C9EE;font-size:15px}
.hero-art svg{width:100%;height:auto;display:block;overflow:visible}

/* animaciones del héroe */
.float-a{animation:floatY 5s ease-in-out infinite}
.float-b{animation:floatY 6s ease-in-out -2s infinite}
.float-c{animation:floatY 4.5s ease-in-out -1s infinite}
.float-d{animation:floatY 7s ease-in-out -3s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.ln{transform-box:fill-box;transform-origin:left center;animation:typing 7s ease-in-out infinite}
.cursor{animation:blink 1s steps(2) infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes typing{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes blink{50%{opacity:0}}

/* ---------- secciones ---------- */
.sec{padding:60px clamp(18px,5vw,56px)}
.sec-in{max-width:1100px;margin:0 auto}
.sec-title{text-align:center;margin-bottom:34px}
.sec-title small{display:block;color:var(--brand);font-weight:600;font-size:15px;margin-bottom:4px}
.sec-title h2{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.025em;line-height:1.12;margin:0}
.sec-title h2 em,.about h2 em{font-style:normal;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;color:inherit}
.tcard:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(20,50,130,.18);border-color:var(--brand)}
.tcard .ic{width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:30px}
.tcard b{font-size:17px;line-height:1.2}
.tcard span{color:var(--muted);font-size:14px;line-height:1.4}
.tcard .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--brand)}

.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.about h2{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.025em;line-height:1.12;margin:0 0 12px}
.about p{color:var(--muted);max-width:52ch}
.checks{list-style:none;padding:0;margin:16px 0 22px}
.checks li{display:flex;gap:10px;margin:8px 0}
.checks li::before{content:"✓";flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:13px;display:grid;place-items:center;font-weight:700;margin-top:2px}

.bcard{position:relative;background:#0B1633;color:#DCE6F8;border-radius:18px;padding:0 0 18px;box-shadow:0 24px 50px rgba(8,26,71,.35);overflow:visible}
.bcard .bar{display:flex;gap:7px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.bcard .bar i{width:11px;height:11px;border-radius:50%;background:#FF6058}
.bcard .bar i:nth-child(2){background:#FFBD2E}
.bcard .bar i:nth-child(3){background:#28C940}
.bcard .bar span{margin-left:8px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:#8FA1C6}
.bcard table{width:100%;border-collapse:collapse;font-size:15px}
.bcard td{padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.bcard td:first-child{font-family:"JetBrains Mono",ui-monospace,monospace;color:#8FA1C6;width:56px}
.verd{position:relative;display:inline-block;width:92px;height:24px}
.verd span{position:absolute;left:0;top:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.verd .pend{background:#2A3C6B;color:#C7D5F5;animation:pend 8s infinite}
.verd .done.ac{background:#12382B;color:#4CD197}
.verd .done.wa{background:#442019;color:#FF8B7C}
.verd .done{animation:done 8s infinite}
tr:nth-child(1) .verd span{animation-delay:0s}
tr:nth-child(2) .verd span{animation-delay:.6s}
tr:nth-child(3) .verd span{animation-delay:1.2s}
tr:nth-child(4) .verd span{animation-delay:1.8s}
tr:nth-child(5) .verd span{animation-delay:2.4s}
@keyframes pend{0%,30%{opacity:1}36%,100%{opacity:0}}
@keyframes done{0%,30%{opacity:0;transform:scale(.6)}38%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
.badge{position:absolute;right:-14px;bottom:-22px;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px 20px;text-align:center;box-shadow:0 12px 26px rgba(47,107,255,.45);animation:floatY 5s ease-in-out infinite}
.badge b{display:block;font-size:30px;line-height:1;letter-spacing:-.03em}
.badge span{font-size:13px}

.statbar{background:linear-gradient(90deg,#061238,#0E2D78);color:#fff}
.statbar-in{max-width:1100px;margin:0 auto;padding:30px clamp(18px,5vw,56px);display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.st{display:flex;align-items:center;gap:14px;justify-content:center}
.st .ic{font-size:34px}
.st b{display:block;font-size:34px;line-height:1;letter-spacing:-.03em}
.st span{font-size:14px;color:#B9C9EE}

.showcase{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.cs{background:var(--code-bg);color:var(--code-ink);border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(8,26,71,.28)}
.cs .bar{display:flex;gap:7px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.cs .bar i{width:11px;height:11px;border-radius:50%;background:#FF6058}
.cs .bar i:nth-child(2){background:#FFBD2E}
.cs .bar i:nth-child(3){background:#28C940}
.cs .bar b{margin-left:8px;font-weight:600;font-size:14px}
.cs pre{margin:0;padding:18px;overflow-x:auto;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;line-height:1.65;min-height:150px}
.cs .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.1)}
.cs .ctl button{background:rgba(255,255,255,.1);border:0;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.cs .ctl button:hover{background:var(--brand)}
.cs .ctl .go{width:auto;padding:0 14px;border-radius:999px;font-size:14px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .2s}
.dots i.on{background:#5C93FF;width:22px;border-radius:5px}
.legend{display:grid;gap:12px}
.lg{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lg .verdict{margin-top:2px}
.lg b{display:block;line-height:1.2}
.lg span{color:var(--muted);font-size:15px}

.banner{background:linear-gradient(100deg,#0A2263,#1546C4);color:#fff}
.banner-in{max-width:1100px;margin:0 auto;padding:30px clamp(18px,5vw,56px);display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner .txt{display:flex;gap:16px;align-items:center}
.banner svg{flex:0 0 54px;animation:floatY 4s ease-in-out infinite}
.banner h3{margin:0;font-size:24px;letter-spacing:-.02em}
.banner p{margin:2px 0 0;color:#C7D5F5}

footer.foot{background:var(--panel);border-top:1px solid var(--line);padding:34px clamp(18px,5vw,56px) 24px}
.foot-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px}
.foot b{display:block;margin-bottom:8px}
.foot ul{list-style:none;margin:0;padding:0}
.foot li button{background:none;border:0;padding:3px 0;color:var(--muted);cursor:pointer;font-size:15px;text-align:left}
.foot li button:hover{color:var(--brand)}
.foot p{color:var(--muted);font-size:15px;margin:6px 0 0;max-width:34ch}
.foot .copy{max-width:1100px;margin:22px auto 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}

/* ---------- tema ---------- */
.thead{position:relative;overflow:hidden;background:linear-gradient(135deg,#061238,#0E2D78);color:#fff}
.thead::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 85% 30%,rgba(92,147,255,.45),transparent 45%)}
.thead-in{position:relative;max-width:920px;margin:0 auto;padding:40px clamp(18px,5vw,56px);display:flex;gap:24px;align-items:center}
.thead .bigic{flex:0 0 96px;height:96px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:52px;animation:floatY 5s ease-in-out infinite}
.thead small{color:#9DB7F5;font-size:15px}
.thead h1{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:2px 0 8px}
.thead p{margin:0;color:#C7D5F5;font-size:18px;max-width:56ch}
.wrap{max-width:920px;margin:0 auto;padding:30px clamp(18px,5vw,56px) 60px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card .k{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:16px}
.codewin{background:var(--code-bg);border-radius:14px;overflow:hidden;margin:22px 0;box-shadow:0 14px 30px rgba(8,26,71,.22)}
.codewin .bar{display:flex;gap:7px;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.codewin .bar i{width:11px;height:11px;border-radius:50%;background:#FF6058}
.codewin .bar i:nth-child(2){background:#FFBD2E}
.codewin .bar i:nth-child(3){background:#28C940}
.codewin .bar span{margin-left:8px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:#8FA1C6}
.codewin pre{margin:0;padding:16px 18px;overflow-x:auto;color:var(--code-ink);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;line-height:1.65}
.tip{display:flex;gap:12px;border-left:5px solid var(--tle);background:var(--tle-bg);padding:12px 16px;border-radius:0 12px 12px 0;margin:18px 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}

/* ---------- evaluación ---------- */
.qprog{margin-top:16px;max-width:420px}
.qprog span{font-size:14px;color:#B9C9EE}
.qprog .bar{height:8px;background:rgba(255,255,255,.18);border-radius:5px;margin-top:6px;overflow:hidden}
.qprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5C93FF,#5EE0B0);transition:width .3s}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0}
.q.is-ac{border-color:var(--ac)}
.q.is-wa{border-color:var(--wa)}
.q .qh{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.q .qh strong{font-size:18px}
.q .qt{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);margin-bottom:4px}
.verdict{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.verdict.ac{background:var(--ac-bg);color:var(--ac)}
.verdict.wa{background:var(--wa-bg);color:var(--wa)}
.verdict.tle{background:var(--tle-bg);color:var(--tle)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt.right{border-color:var(--ac);background:var(--ac-bg)}
.opt.wrong{border-color:var(--wa);background:var(--wa-bg)}
.why{margin:10px 0 0;color:var(--muted);font-size:15.5px}
.warn{background:var(--tle-bg);color:var(--ink);border:1px solid var(--tle);padding:10px 14px;border-radius:10px;margin:14px 0}
.result{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 24px;margin:6px 0 20px}
.result.pass{border-color:var(--ac)}
.result.fail{border-color:var(--wa)}
.result .big{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1}
.board{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.board span{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}
.board .ac{background:var(--ac-bg);color:var(--ac)}
.board .wa{background:var(--wa-bg);color:var(--wa)}
.plan{list-style:none;padding:0;margin:10px 0 0}
.plan li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plan button{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer}
.plan button:hover{border-color:var(--brand)}
.confetti{position:fixed;top:-16px;width:10px;height:14px;z-index:60;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.theme{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.18)}

/* ---------- responsivo ---------- */
@media (max-width:980px){
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:560px;margin:0 auto;width:100%}
  .about,.showcase{grid-template-columns:minmax(0,1fr)}
  .about .bcard{margin-bottom:26px}
  .statbar-in{grid-template-columns:repeat(2,1fr);row-gap:22px}
  .foot-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .foot-in>div:first-child{grid-column:1/-1}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink);padding:10px 14px}

 {t:"Complejidad",

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k==="text") e.textContent=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  kids.flat().forEach(c => e.append(c));
  return e;
}
function html(str){const t=document.createElement("template");t.innerHTML=str.trim();return t.content;}

/* ---------- menú ---------- */
function buildNav(){
  nav.replaceChildren();
  const add = (id, ic, label) => {
    const v = el("span",{class:"v"});
    const seen = el("span",{class:"seen"});
    const b = el("button",{type:"button","data-id":id,onclick:()=>go(id)},
      el("span",{class:"n",text:ic}), el("span",{class:"t",text:label}), v, seen);
    nav.append(el("li",{},b));
  };
  add("home","🏠","Inicio");
  nav.append(el("li",{class:"sep","aria-hidden":"true"}));
  TOPICS.forEach((t,i)=>add(String(i), META[i][0], t.t));
  nav.append(el("li",{class:"sep","aria-hidden":"true"}));
  add("quiz","🏁","Evaluación");
}
function refreshNav(){
  nav.querySelectorAll("button").forEach(b=>{
    const id=b.dataset.id;
    if (id===state.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    const v=b.querySelector(".v"), s=b.querySelector(".seen");
    v.className="v"; v.textContent="";
    if (/^\d+$/.test(id)){
      s.classList.toggle("on", state.seen.has(+id) && !state.graded);
      if (state.graded){
        const ok = state.answers[id]===TOPICS[+id].q.a;
        v.className="v "+(ok?"ac":"wa"); v.textContent = ok?"AC":"WA";
      }
    }
  });
  const n = state.seen.size;
  $("#meterTxt").textContent = n+" de "+TOPICS.length+" temas vistos";
  $("#meterBar").style.width = (n/TOPICS.length*100)+"%";
}
function go(id){
  state.view = id;
  if (/^\d+$/.test(id)) state.seen.add(+id);
  render(); closeMenu();
  window.scrollTo({top:0});
  main.focus({preventScroll:true});
}
function render(){
  clearInterval(carTimer);
  main.replaceChildren();
  if (state.view==="home") renderHome();
  else if (state.view==="quiz") renderQuiz();
  else renderTopic(+state.view);
  main.append(footer());
  refreshNav();
}
main.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");
  if (b) go(b.dataset.go);
});

    <div class="hero-art">${HERO_SVG}</div>
   </div>
  </section>`));

  const cards = TOPICS.map((t,i)=>`
    <button type="button" class="tcard" data-go="${i}">
      <span class="ic" aria-hidden="true">${META[i][0]}</span>
      <span class="num">Tema ${String(i+1).padStart(2,"0")}</span>
      <b>${t.t}</b>
      <span>${META[i][1]}</span>
    </button>`).join("");
  main.append(html(`
  <section class="sec"><div class="sec-in">
   <div class="sec-title"><small>Qué aprenderás</small><h2>Los <em>10 temas</em> del curso</h2></div>
   <div class="grid">${cards}</div>
  </div></section>`));

  main.append(html(`
  <section class="sec" style="padding-top:20px"><div class="sec-in about">
   <div class="bcard">
    <div class="bar"><i></i><i></i><i></i><span>marcador en vivo</span></div>
    <table aria-label="Ejemplo de marcador con veredictos">
     <tr><td>P1</td><td>Complejidad</td><td><span class="verd"><span class="pend">Juzgando…</span><span class="done ac">AC</span></span></td></tr>
     <tr><td>P2</td><td>Estructuras</td><td><span class="verd"><span class="pend">Juzgando…</span><span class="done ac">AC</span></span></td></tr>
     <tr><td>P3</td><td>Fuerza bruta</td><td><span class="verd"><span class="pend">Juzgando…</span><span class="done ac">AC</span></span></td></tr>
     <tr><td>P4</td><td>Ordenamiento</td><td><span class="verd"><span class="pend">Juzgando…</span><span class="done wa">WA</span></span></td></tr>
     <tr><td>P5</td><td>Greedy</td><td><span class="verd"><span class="pend">Juzgando…</span><span class="done ac">AC</span></span></td></tr>
    </table>
    <div class="badge"><b>7/10</b><span>para aprobar</span></div>
   </div>
   <div>
    <h2>Entrena como en un <em>concurso real</em></h2>
    <p>Cada tema te da lo esencial para resolver problemas: la idea, el código y el error más común. Después, la evaluación te dice dónde vas bien y qué conviene repasar.</p>
    <ul class="checks">
     <li>Teoría corta y directa, sin relleno</li>
     <li>Código de ejemplo listo para leer</li>
     <li>Veredicto AC o WA en cada pregunta</li>
     <li>Ruta de repaso con tus temas débiles</li>
    </ul>
    <button class="btn solid" type="button" data-go="quiz">Probar la evaluación →</button>
   </div>
  </div></section>`));

  main.append(html(`
  <section class="statbar"><div class="statbar-in">
   <div class="st"><span class="ic">📚</span><div><b data-n="10">0</b><span>Temas</span></div></div>
   <div class="st"><span class="ic">🧩</span><div><b data-n="30">0</b><span>Conceptos clave</span></div></div>
   <div class="st"><span class="ic">📝</span><div><b data-n="10">0</b><span>Preguntas</span></div></div>
   <div class="st"><span class="ic">🏆</span><div><b data-n="7">0</b><span>Para aprobar</span></div></div>
  </div></section>`));

  main.append(html(`
  <section class="sec"><div class="sec-in">
   <div class="sec-title"><small>Vista previa</small><h2>Código que vas a <em>leer y entender</em></h2></div>
   <div class="showcase">
    <div class="cs" id="cs">
     <div class="bar"><i></i><i></i><i></i><b id="csTitle"></b></div>
     <pre><code id="csCode"></code></pre>
     <div class="ctl">
      <button type="button" id="csPrev" aria-label="Ejemplo anterior">‹</button>
      <div class="dots" id="csDots" aria-hidden="true"></div>
      <button type="button" class="go" id="csGo">Ver tema</button>
      <button type="button" id="csNext" aria-label="Ejemplo siguiente">›</button>
     </div>
    </div>
    <div class="legend">
     <div class="lg"><span class="verdict ac">AC</span><div><b>Accepted</b><span>Tu respuesta es correcta.</span></div></div>
     <div class="lg"><span class="verdict wa">WA</span><div><b>Wrong Answer</b><span>La respuesta es incorrecta. Revisa la explicación y repasa el tema.</span></div></div>
     <div class="lg"><span class="verdict tle">TLE</span><div><b>Time Limit Exceeded</b><span>La idea es correcta pero tarda demasiado. Aquí entra la complejidad.</span></div></div>
    </div>
   </div>
  </div></section>`));

  main.append(html(`
  <section class="banner"><div class="banner-in">
   <div class="txt">${PLANE_SVG}<div><h3>¿Listo para ponerte a prueba?</h3><p>Responde 10 preguntas y recibe tu ruta de repaso.</p></div></div>
   <button class="btn white" type="button" data-go="quiz">Calificar mi nivel →</button>
  </div></section>`));

  mountCarousel();
  mountCounters();
}

function mountCarousel(){
  let i = 0;
  const title=$("#csTitle"), code=$("#csCode"), dots=$("#csDots");
  TOPICS.forEach(()=>dots.append(el("i")));
  function show(n){
    i = (n+TOPICS.length)%TOPICS.length;
    title.textContent = "Tema "+(i+1)+": "+TOPICS[i].t;
    code.textContent = TOPICS[i].code;
    [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  }
  $("#csPrev").addEventListener("click",()=>{show(i-1);restart();});
  $("#csNext").addEventListener("click",()=>{show(i+1);restart();});
  $("#csGo").addEventListener("click",()=>go(String(i)));
  function restart(){ clearInterval(carTimer); if(!reduced) carTimer=setInterval(()=>show(i+1),5500); }
  $("#cs").addEventListener("mouseenter",()=>clearInterval(carTimer));
  $("#cs").addEventListener("mouseleave",restart);
  show(0); restart();
}

function mountCounters(){
  const nums = main.querySelectorAll("[data-n]");
  const setAll = () => nums.forEach(n=>n.textContent=n.dataset.n);
  if (reduced || !("IntersectionObserver" in window)){ setAll(); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      io.disconnect();
      const t0=performance.now(), dur=1200;
      (function tick(t){
        const p=Math.min((t-t0)/dur,1);
        nums.forEach(n=>n.textContent=Math.round(+n.dataset.n*p));
        if(p<1) requestAnimationFrame(tick);
      })(t0);
    });
  },{threshold:.4});
  const bar = main.querySelector(".statbar");
  if (bar) io.observe(bar); else setAll();
}

function footer(){
  const f = el("footer",{class:"foot"});
  const col = (arr)=>el("ul",{},arr.map(i=>el("li",{},el("button",{type:"button",onclick:()=>go(String(i))},TOPICS[i].t))));
  f.append(
    el("div",{class:"foot-in"},
      el("div",{},el("b",{text:"Juez Tutor"}),el("p",{text:"Agente educativo de programación competitiva: estudia, practica y califica tu avance."})),
      el("div",{},el("b",{text:"Temas 1 a 5"}),col([0,1,2,3,4])),
      el("div",{},el("b",{text:"Temas 6 a 10"}),col([5,6,7,8,9]))
    ),
    el("div",{class:"copy",text:"Proyecto de Seminario de Computación, grupo 030. Contenido tomado como referencia de Ruta OMI."})
  );
  return f;
}

/* ---------- tema ---------- */
function renderTopic(i){
  const t = TOPICS[i];
  main.append(html(`
   <section class="thead"><div class="thead-in">
    <div class="bigic" aria-hidden="true">${META[i][0]}</div>
    <div><small>Tema ${i+1} de ${TOPICS.length}</small><h1></h1><p></p></div>
   </div></section>`));
  main.querySelector(".thead h1").textContent = t.t;
  main.querySelector(".thead p").textContent = t.intro;

  const wrap = el("div",{class:"wrap"});
  const grid = el("div",{class:"cgrid"});
  t.c.forEach(([h,p],k)=>grid.append(el("div",{class:"card"},el("div",{class:"k",text:String(k+1)}),el("h3",{text:h}),el("p",{text:p}))));
  wrap.append(grid);
  const win = el("div",{class:"codewin"},
    el("div",{class:"bar"},el("i"),el("i"),el("i"),el("span",{text:"ejemplo.cpp"})),
    el("pre",{},el("code",{text:t.code})));
  wrap.append(win);
  wrap.append(el("div",{class:"tip"},el("span",{text:"💡"}),el("div",{},el("strong",{text:"Consejo de concurso: "}),document.createTextNode(t.tip))));
  const prev = i>0 ? el("button",{class:"btn ghost",type:"button",onclick:()=>go(String(i-1))},"← "+TOPICS[i-1].t) : el("span");
  const next = i<TOPICS.length-1
    ? el("button",{class:"btn solid",type:"button",onclick:()=>go(String(i+1))},TOPICS[i+1].t+" →")
    : el("button",{class:"btn solid",type:"button",onclick:()=>go("quiz")},"Ir a la evaluación →");
  wrap.append(el("div",{class:"pager"},prev,next));
  main.append(wrap);
}

/* ---------- evaluación ---------- */
function updateProg(){
  const n = Object.keys(state.answers).length;
  const s=$("#qprogTxt"), b=$("#qprogBar");
  if (s) s.textContent = n+" de "+TOPICS.length+" respondidas";
  if (b) b.style.width = (n/TOPICS.length*100)+"%";
}
function renderQuiz(){
  main.append(html(`
   <section class="thead"><div class="thead-in">
    <div class="bigic" aria-hidden="true">🏁</div>
    <div><small>Evaluación final</small><h1>Ponte a prueba</h1>
     <p>Responde las 10 preguntas y pulsa «Calificar». Aprueba con 7 o más.</p>
     <div class="qprog"><span id="qprogTxt"></span><div class="bar"><i id="qprogBar"></i></div></div>
    </div>
   </div></section>`));
  const wrap = el("div",{class:"wrap"});
  const box = el("div",{id:"resultBox"});
  wrap.append(box);
  TOPICS.forEach((t,i)=>{
    const done = state.graded;
    const ok = state.answers[i]===t.q.a;
    const card = el("section",{class:"q"+(done?(ok?" is-ac":" is-wa"):"")});
    const head = el("div",{class:"qh"},
      el("div",{},el("div",{class:"qt",text:"Pregunta "+(i+1)+" · "+t.t}),el("strong",{text:t.q.p})));
    if (done) head.append(el("span",{class:"verdict "+(ok?"ac":"wa"),text:ok?"AC":"WA"}));
    card.append(head);
    t.q.o.forEach((txt,j)=>{
      const inp = el("input",{type:"radio",name:"q"+i,value:String(j)});
      if (state.answers[i]===j) inp.checked = true;
      if (done) inp.disabled = true;
      inp.addEventListener("change",()=>{state.answers[i]=j;updateProg();});
      let cls="opt";
      if (done){ if (j===t.q.a) cls+=" right"; else if (state.answers[i]===j) cls+=" wrong"; }
      card.append(el("label",{class:cls},inp,el("span",{text:txt})));
    });
    if (done) card.append(el("p",{class:"why",text:t.q.e}));
    wrap.append(card);
  });
  if (!state.graded){
    wrap.append(el("div",{class:"pager"},el("span"),
      el("button",{class:"btn solid",type:"button",onclick:grade},"Calificar ✓")));
  } else {
    wrap.append(el("div",{class:"pager"},el("span"),
      el("button",{class:"btn ghost",type:"button",onclick:retry},"Intentar de nuevo")));
  }
  main.append(wrap);
  updateProg();
  if (state.graded) showResult();
}
function grade(){
  const missing = TOPICS.map((_,i)=>i).filter(i=>state.answers[i]===undefined);
  const box = $("#resultBox");
  box.replaceChildren();
  if (missing.length){
    box.append(el("div",{class:"warn",role:"alert",text:"Faltan por responder: "+missing.map(i=>i+1).join(", ")+". Contesta todas para calificar."}));
    box.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  state.graded = true;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
  const score = TOPICS.filter((t,i)=>state.answers[i]===t.q.a).length;
  if (score>=7) confetti();
}
function showResult(){
  const wrong = TOPICS.map((_,i)=>i).filter(i=>state.answers[i]!==TOPICS[i].q.a);
  const score = TOPICS.length - wrong.length;
  const pass = score>=7;
  const box = $("#resultBox");
  box.replaceChildren();
  const board = el("div",{class:"board","aria-label":"Veredicto por pregunta"});
  TOPICS.forEach((_,i)=>{
    const ok = !wrong.includes(i);
    board.append(el("span",{class:ok?"ac":"wa",text:"P"+(i+1)+" "+(ok?"AC":"WA")}));
  });
  const res = el("div",{class:"result "+(pass?"pass":"fail"),role:"status"},
    el("div",{class:"big",text:score+" / "+TOPICS.length}),
    el("p",{text: pass ? "🎉 Aprobado. Tu resultado alcanza el mínimo de 7." : "Aún no alcanzas el mínimo de 7. Repasa los temas marcados y vuelve a intentarlo."}),
    board
  );
  if (wrong.length){
    const plan = el("ul",{class:"plan"});
    wrong.forEach(i=>{
      plan.append(el("li",{},el("span",{text:META[i][0]+" Tema "+(i+1)+": "+TOPICS[i].t}),
        el("button",{type:"button",onclick:()=>go(String(i))},"Repasar")));
    });
    res.append(el("h2",{text:"Ruta de repaso sugerida",style:"font-size:20px;margin:18px 0 0"}),plan);
  } else {
    res.append(el("p",{text:"Sin fallos. El siguiente paso es resolver problemas reales en un juez en línea."}));
  }
  box.append(res);
}
function retry(){ state.answers = {}; state.graded = false; render(); window.scrollTo({top:0}); }
function confetti(){
  if (reduced) return;
  const colors=["#2F6BFF","#5EE0B0","#F7C14F","#FF8B7C","#9DC0FF"];
  for(let k=0;k<60;k++){
    const c=document.createElement("i");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[k%colors.length];
    c.style.animationDuration=(2.2+Math.random()*2)+"s";
    c.style.animationDelay=(Math.random()*.8)+"s";
    document.body.append(c);
    setTimeout(()=>c.remove(),5200);
  }
}

/* ---------- menú móvil y tema ---------- */
const side=$("#side"), scrim=$("#scrim"), openBtn=$("#openMenu");
function openMenu(){side.classList.add("open");scrim.classList.add("show");openBtn.setAttribute("aria-expanded","true");}
function closeMenu(){side.classList.remove("open");scrim.classList.remove("show");openBtn.setAttribute("aria-expanded","false");}
openBtn.addEventListener("click",openMenu);
scrim.addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme==="dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
});

buildNav();
render();
</script>
